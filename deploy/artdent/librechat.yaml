version: 1.3.16
cache: true
interface:
  appTitle: Artdent AI
  customWelcome: "Рабочее пространство Artdent AI"
  modelSelect: true
  parameters: true
  presets: true
  bookmarks: true
  multiConvo: true
  prompts:
    use: true
    create: true
    share: true
    public: false
  agents:
    use: true
    create: true
    share: true
    public: false
  schedules:
    use: true
    create: true
    maxPerUser: 5
    minIntervalMinutes: 60
    autoDisableAfterFailures: 3
    admissionConcurrency: 5
    fireConcurrency: 2
endpoints:
  agents:
    recursionLimit: 25
    maxRecursionLimit: 50
    capabilities: [execute_code, file_search, artifacts, context, tools, actions, ask_user_question]
  custom:
    - name: OpenRouter
      apiKey: "${OPENROUTER_KEY}"
      baseURL: https://openrouter.ai/api/v1
      models:
        default:
          - openai/gpt-4.1-mini
          - google/gemini-2.5-flash
          - anthropic/claude-sonnet-4.6
          - openai/gpt-5.4
          - openai/gpt-5.6-sol
          - openai/gpt-6-astra
        fetch: false
      titleConvo: true
      titleModel: openai/gpt-4.1-mini
      modelDisplayLabel: OpenRouter
      dropParams: [stop]
fileConfig:
  endpoints:
    agents:
      fileLimit: 100
      fileSizeLimit: 25
      totalSizeLimit: 50
    OpenRouter:
      fileLimit: 100
      fileSizeLimit: 25
      totalSizeLimit: 50
  serverFileSizeLimit: 50
